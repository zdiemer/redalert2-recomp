<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Red Alert 2</title>
<style>
  body { margin:0; background:#000; color:#ddd; font:16px system-ui,sans-serif; overflow:hidden }
  #view { height:100dvh; display:grid; place-items:center }
  canvas { display:block; outline:none; background:#000; touch-action:none }
  #status,#fallback { position:fixed; top:16px; left:16px; z-index:2; background:#101214e8; padding:12px }
  #status[hidden],#fallback[hidden] { display:none }
  #cursor { position:fixed; width:18px; height:24px; z-index:3; pointer-events:none; display:none }
  details { position:fixed; bottom:0; left:0; max-width:100%; z-index:2; background:#101214e8 }
  details:not([open]) { opacity:0.25 }
  pre { white-space:pre-wrap; overflow:auto; max-height:200px; font-size:12px }
</style>
<p id="status">Loading Red Alert 2…</p>
<div id="fallback" hidden><label>Choose your installed game folder: <input id="files" type="file" webkitdirectory multiple></label></div>
<div id="view"><canvas id="canvas" width="800" height="600" tabindex="0" oncontextmenu="event.preventDefault()"></canvas></div>
<svg id="cursor" viewBox="0 0 18 24"><path d="M1 1V20L6 15L10 23L14 21L10 13H17Z" fill="white" stroke="black"/></svg>
<details><summary>Runtime log</summary><pre id="log"></pre></details>
<script>
  const status = document.querySelector('#status');
  const log = document.querySelector('#log');
  const canvas = document.querySelector('#canvas');
  const cursor = document.querySelector('#cursor');
  const params = new URLSearchParams(location.search);
  let ready = false, entries, launched = false;
  function output(line) {
    log.textContent += line + '\n';
    if (log.textContent.length > 100000) log.textContent = log.textContent.slice(-80000);
    console.log(line);
  }
  var Module = {
    canvas, noInitialRun:true, ra2Input:[], ra2Cursor:{x:400,y:300},
    print:output, printErr:output,
    onRuntimeInitialized() { ready = true; maybeLaunch(); },
    onAbort(reason) { status.hidden = false; status.textContent = 'Runtime stopped: ' + reason; },
    onExit(code) { status.hidden = false; status.textContent = 'Game exited (' + code + '). Reload to play again.'; }
  };
  function fitCanvas() {
    const scale = Math.min(innerWidth/canvas.width, innerHeight/canvas.height);
    canvas.style.width = canvas.width*scale + 'px';
    canvas.style.height = canvas.height*scale + 'px';
    drawCursor();
  }
  function drawCursor() {
    const r = canvas.getBoundingClientRect(); const p = Module.ra2Cursor;
    cursor.style.left = r.left + p.x*r.width/canvas.width + 'px';
    cursor.style.top = r.top + p.y*r.height/canvas.height + 'px';
    cursor.style.display = document.pointerLockElement === canvas && Module.ra2SystemCursor ? 'block' : 'none';
  }
  Module.ra2Resize = fitCanvas;
  Module.ra2DrawCursor = drawCursor;
  addEventListener('resize', fitCanvas);
  document.addEventListener('pointerlockchange', () => { canvas.focus(); drawCursor(); });
  function setIni(text, section, key, value) {
    const lines = text.split(/\r?\n/); let active = false, found = false, present = false;
    for (let i=0; i<lines.length; i++) {
      if (/^\s*\[/.test(lines[i])) {
        if (active && !found) { lines.splice(i++,0,key+'='+value); found=true; }
        active = lines[i].trim().toLowerCase() === '['+section.toLowerCase()+']';
        present ||= active;
      } else if (active && lines[i].split('=')[0].trim().toLowerCase() === key.toLowerCase()) {
        lines[i] = key+'='+value; found=true;
      }
    }
    if (!found) { if (!present) lines.push('['+section+']'); lines.push(key+'='+value); }
    return lines.join('\r\n');
  }
  function widescreen() {
    const specified = /^(\d+)x(\d+)$/.exec(params.get('resolution') || '');
    const width = Math.max(640, Math.round(specified ? +specified[1] : screen.width*devicePixelRatio));
    const height = Math.max(480, Math.round(specified ? +specified[2] : screen.height*devicePixelRatio));
    const name = entries.some(e=>e.name.toLowerCase()==='game.exe') ? 'ra2.ini' : 'ra2md.ini';
    const path = '/game/'+name;
    let text = Module.FS.analyzePath(path).exists ? Module.FS.readFile(path,{encoding:'utf8'}) : '';
    text = setIni(setIni(text,'Video','ScreenWidth',width),'Video','ScreenHeight',height);
    Module.FS.writeFile(path,text);
    Module.ra2Resolution = {width,height};
    output('[browser] widescreen '+width+'x'+height);
  }
  async function maybeLaunch() {
    if (!ready || !entries || launched) return;
    launched = true;
    try {
      Module.ra2Audio = new AudioContext();
      Module.FS.mkdirTree('/game'); Module.FS.mkdirTree('/fonts');
      let n = 0;
      for (const entry of entries) {
        status.textContent = `Loading ${++n}/${entries.length}: ${entry.name}`;
        Module.FS.writeFile('/game/'+entry.name.toLowerCase(),new Uint8Array(await entry.read()),{canOwn:true});
      }
      const response = await fetch('/local-font');
      if (!response.ok) throw Error('Font missing: set --font to a TrueType font when starting the local server.');
      Module.FS.writeFile('/fonts/arial.ttf',new Uint8Array(await response.arrayBuffer()),{canOwn:true});
      widescreen();
      status.textContent = 'Starting game…'; canvas.focus();
      Module.callMain(['--game','/game','--run',...params.getAll('arg')]);
    } catch (error) { status.hidden=false; status.textContent=error.message; output(error.stack); }
  }
  function queue(event) {
    if (Module.ra2InputBuffer !== undefined) {
      const base = Module.ra2InputBuffer >>> 2;
      const read = Atomics.load(HEAPU32, base);
      const write = Atomics.load(HEAPU32, base+1);
      if (((write-read)>>>0) >= 1024) return;
      HEAP32.set(event, base+2+(write%1024)*4);
      Atomics.store(HEAPU32, base+1, (write+1)>>>0);
      return;
    }
    const q = Module.ra2Input;
    if (event[0]===0 && event[1]===0x200 && q.length && q.at(-1)[0]===0 && q.at(-1)[1]===0x200) q[q.length-1]=event;
    else if (q.length<1024) q.push(event);
  }
  Module.ra2AttachInput = address => {
    Module.ra2InputBuffer = address;
    for (const event of Module.ra2Input) queue(event);
    Module.ra2Input.length = 0;
  };
  function resumeAudio() { Module.ra2Audio?.resume().catch(()=>{}); }
  const held = new Set();
  for (const [type,down] of [['keydown',1],['keyup',0]]) canvas.addEventListener(type,e=>{
    if (e.code==='F11') return;
    resumeAudio(); e.preventDefault();
    if (down) held.add(e.keyCode); else held.delete(e.keyCode);
    queue([1,down,e.keyCode,0]);
  });
  for (const [type,base] of [['pointermove',0x200],['pointerdown',0x201],['pointerup',0x202]]) {
    canvas.addEventListener(type,e=>{
      const r = canvas.getBoundingClientRect(); const p = Module.ra2Cursor;
      if (document.pointerLockElement===canvas) {
        if (type==='pointermove') { p.x+=e.movementX*canvas.width/r.width; p.y+=e.movementY*canvas.height/r.height; }
      } else { p.x=(e.clientX-r.left)*canvas.width/r.width; p.y=(e.clientY-r.top)*canvas.height/r.height; }
      p.x=Math.max(0,Math.min(canvas.width-1,p.x)); p.y=Math.max(0,Math.min(canvas.height-1,p.y));
      if (type==='pointerdown') {
        resumeAudio(); canvas.focus();
        if (document.pointerLockElement!==canvas) {
          if (e.pointerId>=0) canvas.setPointerCapture(e.pointerId);
          canvas.requestPointerLock()?.catch(()=>{});
        }
      }
      queue([0,base+(type==='pointermove'?0:e.button===2?3:e.button===1?6:0),Math.floor(p.x),Math.floor(p.y)]);
      drawCursor(); e.preventDefault();
    });
  }
  addEventListener('blur',()=>{
    for (const key of held) queue([1,0,key,0]); held.clear();
    for (const message of [0x202,0x205,0x208]) queue([0,message,Math.floor(Module.ra2Cursor.x),Math.floor(Module.ra2Cursor.y)]);
  });
  document.querySelector('#files').onchange = e=>{
    entries = [...e.target.files].filter(f=>/\.(mix|mmx|yro|map|ini|csf|pkt|tlb)$/i.test(f.name)||/^(game\.exe|gamemd\.exe|blowfish\.dll)$/i.test(f.name))
      .map(f=>({name:f.name,read:()=>f.arrayBuffer()}));
    document.querySelector('#fallback').hidden=true; maybeLaunch();
  };
  if (!crossOriginIsolated) status.textContent='Start the local server to enable browser threads.';
  fetch('/local-manifest').then(r=>r.ok?r.json():null).then(manifest=>{
    if (!manifest) { status.hidden=true; document.querySelector('#fallback').hidden=false; return; }
    entries = manifest.map(e=>({name:e.name,read:async()=>{
      const r=await fetch('/local-game/'+encodeURIComponent(e.name));
      if (!r.ok) throw Error('Cannot load '+e.name); return r.arrayBuffer();
    }}));
    maybeLaunch();
  }).catch(error=>{ status.textContent=error.message; });
  fitCanvas();
</script>

</html>
